name: production-smoke

# threats.0rce.com production regression smoke — READ-ONLY.
# Production'a yazma, DB migration, deploy veya backfill YAPMAZ; yalnız public endpoint'leri GET ile doğrular.
# Secret gerektirmez (public endpoint'lerle çalışır).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'smoke (hızlı) veya audit (ağır/günlük)'
        default: 'smoke'
        type: choice
        options: [smoke, audit]
      base_url:
        description: 'Base URL (varsayılan https://threats.0rce.com)'
        default: 'https://threats.0rce.com'
        type: string
  push:
    branches: [main]
    paths:
      - 'scripts/production-smoke.mjs'
      - '.github/workflows/production-smoke.yml'
      - 'package.json'
  pull_request:
    branches: [main]
  schedule:
    # Her 30 dakikada bir hızlı smoke
    - cron: '*/30 * * * *'

# Aynı anda üst üste production testi koşmasın
concurrency:
  group: production-smoke
  cancel-in-progress: false

# En düşük gerekli izinler
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Fork PR'larında cron/dispatch çalıştırma; public endpoint yine de güvenli ama gereksiz yükten kaçın
    if: >-
      (github.event_name == 'schedule' && github.repository == '0rce-Labs/threats-0rce') ||
      (github.event_name == 'workflow_dispatch' && github.repository == '0rce-Labs/threats-0rce') ||
      github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (LTS 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install (root dev deps yok)
        run: npm install --package-lock=false --no-audit --no-fund || true

      - name: Determine mode (audit günlük)
        id: mode
        run: |
          # Eğer saat belirli bir zamandaysa ağır audit yap (günlük bir kez) — basit: her # diğer schedule aynı
          # Basit kural: workflow_dispatch mode input varsa onu kullan; schedule'da audit günde 1 kez (UTC 04:05)
          MODE="smoke"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            HOUR=$(date -u +%H)
            MIN=$(date -u +%M)
            if [ "$HOUR" = "04" ] && [ "$MIN" = "05" ]; then MODE="audit"; fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Run production smoke (hızlı)
        if: steps.mode.outputs.mode == 'smoke'
        env:
          BASE_URL: ${{ inputs.base_url || 'https://threats.0rce.com' }}
        run: node scripts/production-smoke.mjs
        continue-on-error: true # log'u topla, sonra exit'e çevir (aşağıda FAIL artifact)

      - name: Run production audit (ağır, günde 1)
        if: steps.mode.outputs.mode == 'audit'
        env:
          BASE_URL: ${{ inputs.base_url || 'https://threats.0rce.com' }}
        run: node scripts/production-smoke.mjs --audit
        continue-on-error: true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-logs
          path: '*.log'
          if-no-files-found: ignore

      # Test gerçekten geçip geçmediğini exit koduyla doğrula (continue-on-error yüzünden manuel)
      - name: Fail if smoke failed
        if: steps.mode.outputs.mode == 'smoke' && steps.smoke.outcome == 'failure'
        run: exit 1
