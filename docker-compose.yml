name: threats

services:
  postgres:
    image: postgres:16-alpine
    container_name: threats-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: threats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: threats
    volumes:
      - ./db/postgres-data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threats -d threats"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - threats-net

  redis:
    image: redis:7-alpine
    container_name: threats-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ./db/redis-data:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - threats-net

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: threats-app:latest
    container_name: threats-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://threats:${POSTGRES_PASSWORD}@postgres:5432/threats
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:27100:3000"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - threats-net

  worker:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: threats-app:latest
    container_name: threats-worker
    restart: unless-stopped
    command: sh -c "while true; do sh /scripts/collect.sh; sleep 21600; done"
    environment:
      DATABASE_URL: postgresql://threats:${POSTGRES_PASSWORD}@postgres:5432/threats
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    volumes:
      - ./collector:/app/collector:ro
      - ./scripts:/scripts:ro
      - ./app/node_modules:/app/node_modules:ro
      - ./collector/content-backfill.ts:/app/content-backfill.ts:ro
      - ./collector/collect-advisories.ts:/app/collect-advisories.ts:ro
      - ./collector/collect-stix.ts:/app/collect-stix.ts:ro
      - ./collector/fetch-fulltext.ts:/app/fetch-fulltext.ts:ro
      - ./collector/link-iocs.ts:/app/link-iocs.ts:ro
      - ./collector/link-actors.ts:/app/link-actors.ts:ro
      - ./collector/generate-report.ts:/app/generate-report.ts:ro
      - ./collector/alert-webhook.ts:/app/alert-webhook.ts:ro
      - ./collector/enrich-epss-kev.ts:/app/enrich-epss-kev.ts:ro
      - ./reports:/app/reports
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - threats-net

networks:
  threats-net:
    driver: bridge
